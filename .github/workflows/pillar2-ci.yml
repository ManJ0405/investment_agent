name: Pillar2 CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/pillar2-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/pillar2-ci.yml"

jobs:
  pillar2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run Pillar2 unit tests
        run: |
          python -m pytest -q \
            backend/tests/unit/test_pillar2_trend_service.py \
            backend/tests/unit/test_pillar2_api_payload.py \
            backend/tests/unit/test_pillar2_api_routes.py

      - name: Python compile smoke
        run: |
          python -m compileall backend/src/pillars backend/src/api backend/src/tools

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend container
        run: |
          docker build -f backend/Dockerfile backend

